[project]
name = "exp02-dense-sweep"
version = "0.1.0"
description = "Embedding model x chunking sweep (numpy cosine retrieval, cached embeddings)."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "sentence-transformers>=5.0",
    "transformers>=4.51",
    "huggingface-hub>=0.30",
    "model2vec>=0.5",
    "einops",
    "rag-eval",
]

[tool.uv.sources]
rag-eval = { path = "../common", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
