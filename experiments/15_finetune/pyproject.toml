[project]
name = "exp15-finetune"
version = "0.1.0"
description = "Fine-tune a small embedder / cross-encoder on the train split (hard negatives from BM25); evaluate on val."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "sentence-transformers>=5.0",
    "transformers>=4.51",
    "datasets",
    "accelerate",
    "bm25s>=0.2",
    "PyStemmer",
    "numpy",
    "rag-eval",
]

[tool.uv.sources]
rag-eval = { path = "../common", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
