[project]
name = "exp16-legal-models"
version = "0.1.0"
description = "In-domain Belgian legal retrieval models (maastrichtlawtech) zero-shot + fine-tuning on BSARD; evaluated on the tax corpora A/B/C."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "sentence-transformers>=5.0",
    "transformers>=4.51",
    "datasets",
    "accelerate",
    "bm25s>=0.2",
    "PyStemmer",
    "numpy",
    "rag-eval",
]

[tool.uv.sources]
rag-eval = { path = "../common", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
