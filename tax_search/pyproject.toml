[project]
name = "tax-search"
version = "0.1.0"
description = "Semantic search primitives for Belgian tax documents (Qdrant + embeddings + strategies)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "qdrant-client>=1.14.0",
    "sentence-transformers>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_search"]
