[project]
name = "tax-on-web4ai"
version = "0.1.0"
description = "Belgian tax MCP server and ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
# No direct dependencies — the root project is a UV workspace aggregator.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.uv.workspace]
members = ["tax_search", "mcp_server", "ingestion"]

[tool.uv.sources]
tax-search = { workspace = true }
tax-mcp-server = { workspace = true }
tax-ingestion = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
asyncio_mode = "auto"
