[project]
name = "tax-ingestion"
version = "0.1.0"
description = "Belgian tax document ingestion, cleaning, benchmarking, and search evaluation"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.8.6",
    "curl-cffi>=0.15.0",
    "currency>=0.1.2",
    "fastembed>=0.6.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pymupdf4llm>=1.27.2.2",
    "tax-search",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_ingestion"]

[tool.uv.sources]
tax-search = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
