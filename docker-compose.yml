# Deploy stack: MCP server + Qdrant (no ingestion deps).
#
# The MCP image is built from the repo root so the Dockerfile can COPY both
# the shared tax_search package and the mcp_server package.
#
# Configure MCP runtime via environment (all optional):
#   QDRANT_URL          default: http://qdrant:6333
#   QDRANT_COLLECTION   default: belgian_tax_docs
#   QDRANT_VECTOR_SIZE  default: 384
#   EMBEDDING_MODEL     default: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_prod_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-belgian_tax_docs}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-384}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    ports:
      - "8000:8000"

volumes:
  qdrant_prod_storage:
    name: tax_qdrant_prod_storage
