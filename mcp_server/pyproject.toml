[project]
name = "tax-mcp-server"
version = "0.1.0"
description = "FastMCP server exposing Belgian tax semantic search and SPF Finances scraping"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "tax-search",
    "async-lru>=2.3.0",
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.8.6",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_mcp"]

[tool.uv.sources]
tax-search = { workspace = true }
